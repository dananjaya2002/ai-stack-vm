version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # RESOURCE TUNING: Fast indexed vector searches without hogging resources
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 10gb
        reservations:
          cpus: '4'
          memory: 4gb

  memory-proxy:
    image: ai-stack/memory-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.memory-proxy
    container_name: memory-proxy
    env_file:
      - scripts/memory-proxy/.example.memory-api.env
    ports:
      - "9002:9002"
    depends_on:
      - qdrant
    volumes:
      - memory_logs:/logs/memory
      - ${HOME}/ai-stack/memory/engineering-memory:/memory/engineering-memory:ro
    restart: unless-stopped
    # RESOURCE TUNING: Standard background context loading
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12gb
        reservations:
          cpus: '4'
          memory: 6gb

  code-proxy:
    image: ai-stack/code-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.code-proxy
    container_name: code-proxy
    env_file:
      - scripts/code-proxy/.example.code-proxy.env
    ports:
      - "9001:9001"
    depends_on:
      - qdrant
    volumes:
      - code_logs:/logs/code
      - ${HOME}/ai-stack/memory/code-memory:/memory/code-memory:ro
    restart: unless-stopped
    # RESOURCE TUNING: Main worker handling active token requests and embedding calculations
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 20gb
        reservations:
          cpus: '8'
          memory: 10gb

volumes:
  qdrant_data:
  memory_logs:
  code_logs: