services:

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${BIND_HOST:-127.0.0.1}:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 6gb
        reservations:
          cpus: '2'
          memory: 2gb

  memory-proxy:
    image: ai-stack/memory-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.rag-services
      target: memory-proxy
      args:
        PYTORCH_BACKEND: cpu
    container_name: memory-proxy
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-development}
      AI_STACK_API_KEY: ${AI_STACK_API_KEY:-}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      SKIP_UTILITY_PROMPTS: ${SKIP_UTILITY_PROMPTS:-true}
      MEMORY_API_LOGS: ${MEMORY_API_LOGS:-true}
      MEMORY_API_LOG_FILE: ${MEMORY_API_LOG_FILE:-/logs/memory/memory_api.log}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${MEMORY_COLLECTION:-engineering-memory}
      MEMORY_DIR: /memory
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vm-llama:8082/v1}
      LLM_MODEL: ${MODEL_NAME:-qwen2.5-coder-3b-instruct}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-5}
      MEMORY_SCORE_THRESHOLD: ${MEMORY_SCORE_THRESHOLD:-0.25}
      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_DEVICE: cpu
    ports:
      - "${BIND_HOST:-127.0.0.1}:9002:9002"
    depends_on:
      - qdrant
    volumes:
      - memory_logs:/logs/memory
      - ${AI_STACK_HOME}/memory/engineering-memory:/memory:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
        reservations:
          cpus: '1'
          memory: 2gb

  code-proxy:
    image: ai-stack/code-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.rag-services
      target: code-proxy
      args:
        PYTORCH_BACKEND: cpu
    container_name: code-proxy
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-development}
      AI_STACK_API_KEY: ${AI_STACK_API_KEY:-}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      SKIP_UTILITY_PROMPTS: ${SKIP_UTILITY_PROMPTS:-true}
      CODE_PROXY_LOGS: ${CODE_PROXY_LOGS:-true}
      CODE_PROXY_LOG_FILE: ${CODE_PROXY_LOG_FILE:-/logs/code/code_proxy.log}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${CODE_COLLECTION:-code-memory}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vm-llama:8082/v1}
      LLM_MODEL: ${MODEL_NAME:-qwen2.5-coder-3b-instruct}
      CODE_TOP_K: ${CODE_TOP_K:-8}
      SEARCH_LIMIT_MULTIPLIER: ${SEARCH_LIMIT_MULTIPLIER:-4}
      CODE_SCORE_THRESHOLD: ${CODE_SCORE_THRESHOLD:-0.25}
      MAX_CHUNKS_PER_FILE: ${MAX_CHUNKS_PER_FILE:-2}
      MAX_TEXT_PREVIEW_CHARS: ${MAX_TEXT_PREVIEW_CHARS:-1200}
      REPOS_ROOT: /code-memory
      EMBEDDING_DEVICE: cpu
    ports:
      - "${BIND_HOST:-127.0.0.1}:9001:9001"
    depends_on:
      - qdrant
    volumes:
      - code_logs:/logs/code
      - ${AI_STACK_HOME}/memory/code-memory:/code-memory:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 4gb
        reservations:
          cpus: '2'
          memory: 2gb

  vm-llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vm-llama
    ports:
      - "${BIND_HOST:-127.0.0.1}:8082:8082" # Accessible on your VM host at port 8082
    volumes:
      - ${AI_STACK_HOME}/models:/models:ro
    command: [
      "-m", "/models/${MODEL_FILE:-Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf}",
      "--host", "0.0.0.0",
      "--port", "8082", # Internal port the application listens on
      "-c", "${LLAMA_CONTEXT:-8192}",
      "-b", "${LLAMA_BATCH:-512}",
      "-ub", "${LLAMA_UBATCH:-256}",
      "-t", "${LLAMA_THREADS:-6}",
      "--cache-type-k", "q8_0",
      "--cache-type-v", "q8_0"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${LLAMA_CPU_LIMIT:-8}"
          memory: "${LLAMA_MEMORY_LIMIT:-14gb}"
        reservations:
          cpus: "${LLAMA_CPU_RESERVATION:-4}"
          memory: "${LLAMA_MEMORY_RESERVATION:-8gb}"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      # The bundled 3B model is reliable with pre-injected file context, but it
      # may print Open WebUI's native tool calls as JSON instead of executing
      # them. Keep uploads/RAG enabled while withholding autonomous tools.
      DEFAULT_MODEL_METADATA: '{"capabilities":{"file_context":true,"builtin_tools":false}}'
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
      # Avoid background generations competing with chat inference on the VM.
      ENABLE_AUTOCOMPLETE_GENERATION: ${OPEN_WEBUI_ENABLE_AUTOCOMPLETE_GENERATION:-false}
      ENABLE_FOLLOW_UP_GENERATION: ${OPEN_WEBUI_ENABLE_FOLLOW_UP_GENERATION:-false}
      ENABLE_TAGS_GENERATION: ${OPEN_WEBUI_ENABLE_TAGS_GENERATION:-false}
      # Keep useful chat titles, but do not add a second emoji icon beside the
      # Open WebUI favicon in the browser tab.
      TITLE_GENERATION_PROMPT_TEMPLATE: '${OPEN_WEBUI_TITLE_GENERATION_PROMPT_TEMPLATE:-Generate a concise 3-5 word plain-text title for this chat. Do not use emoji, icons, quotation marks, markdown, or JSON. Return only the title. Chat history: {{MESSAGES:END:2}}}'
    ports:
      - "${OPEN_WEBUI_BIND_HOST:-0.0.0.0}:8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3gb         # Dropped slightly to leave an un-allocatable host OS buffer
        reservations:
          cpus: '1'
          memory: 1gb

volumes:
  qdrant_data:
  memory_logs:
  code_logs:
  open_webui_data:
