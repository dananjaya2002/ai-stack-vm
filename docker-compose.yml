# docker-compose.yml  –  Master: runs Qdrant + memory-proxy + code-proxy together
#
# Usage:
#   docker compose up -d                  # start everything
#   docker compose down                   # stop everything
#   docker compose logs -f                # tail all logs

version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  memory-proxy:
    image: ai-stack/memory-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.memory-proxy
    container_name: memory-proxy
    env_file:
      - scripts/memory-proxy/.example.memory-api.env
    ports:
      - "9002:9002"
    depends_on:
      - qdrant
    volumes:
      - memory_logs:/logs/memory
      - ${HOME}/ai-stack/memory/engineering-memory:/memory/engineering-memory:ro
    restart: unless-stopped

  code-proxy:
    image: ai-stack/code-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.code-proxy
    container_name: code-proxy
    env_file:
      - scripts/code-proxy/.example.code-proxy.env
    ports:
      - "9001:9001"
    depends_on:
      - qdrant
    volumes:
      - code_logs:/logs/code
      - ${HOME}/ai-stack/memory/code-memory:/memory/code-memory:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  memory_logs:
  code_logs:
