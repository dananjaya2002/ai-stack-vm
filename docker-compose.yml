version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8gb
        reservations:
          cpus: '4'
          memory: 2gb

  memory-proxy:
    image: ai-stack/memory-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.memory-proxy
    container_name: memory-proxy
    env_file:
      - scripts/memory-proxy/memory-api.env
    ports:
      - "9002:9002"
    depends_on:
      - qdrant
    volumes:
      - memory_logs:/logs/memory
      - ${HOME}/ai-stack/memory/engineering-memory:/memory:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 4gb
        reservations:
          cpus: '2'
          memory: 2gb

  code-proxy:
    image: ai-stack/code-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.code-proxy
    container_name: code-proxy
    env_file:
      - scripts/code-proxy/code-proxy.env
    ports:
      - "9001:9001"
    depends_on:
      - qdrant
    volumes:
      - code_logs:/logs/code
      - ${HOME}/ai-stack/memory/code-memory:/code-memory:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 4gb
        reservations:
          cpus: '4'
          memory: 2gb

  vm-llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vm-llama
    ports:
      - "8082:8082" # Accessible on your VM host at port 8082
    volumes:
      - ${HOME}/ai-stack/models:/models:ro
    command: [
      "-m", "/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf",
      "--host", "0.0.0.0",
      "--port", "8082", # Internal port the application listens on
      "-c", "12288",
      "-b", "2048",
      "-ub", "1024",
      "-t", "30",
      "--cache-type-k", "q8_0",
      "--cache-type-v", "q8_0"
    ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '54'           # EXPANDED: Gives the threads maximum execution breathing room!
          memory: 38gb        
        reservations:
          cpus: '30'
          memory: 24gb

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3gb         # Dropped slightly to leave an un-allocatable host OS buffer
        reservations:
          cpus: '2'
          memory: 2gb

volumes:
  qdrant_data:
  memory_logs:
  code_logs:
  open_webui_data: