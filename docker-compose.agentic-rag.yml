services:
  agentic-rag:
    image: ai-stack/agentic-rag
    build:
      context: .
      dockerfile: docker/Dockerfile.agentic-rag
    container_name: agentic-rag
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-development}
      AI_STACK_API_KEY: ${AI_STACK_API_KEY:-}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AGENTIC_RAG_LOGS: ${AGENTIC_RAG_LOGS:-true}
      AGENTIC_RAG_LOG_FILE: ${AGENTIC_RAG_LOG_FILE:-/logs/agentic-rag/agentic_rag.log}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-engineering-memory}
      CODE_COLLECTION: ${CODE_COLLECTION:-code-memory}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vm-llama:8082/v1}
      LLM_MODEL: ${MODEL_NAME:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}
      ENABLE_INDEX_V2: ${ENABLE_INDEX_V2:-true}
      ENABLE_AGENTIC_RETRIEVAL: ${ENABLE_AGENTIC_RETRIEVAL:-true}
      AGENTIC_MAX_STEPS: ${AGENTIC_MAX_STEPS:-4}
      AGENTIC_INITIAL_SUBQUERIES: ${AGENTIC_INITIAL_SUBQUERIES:-3}
      AGENTIC_FOLLOWUP_TOP_K: ${AGENTIC_FOLLOWUP_TOP_K:-4}
      AGENTIC_MAX_TOTAL_CHUNKS: ${AGENTIC_MAX_TOTAL_CHUNKS:-16}
      AGENTIC_MIN_CONFIDENCE: ${AGENTIC_MIN_CONFIDENCE:-0.70}
      AGENTIC_TOP_K_PER_QUERY: ${AGENTIC_TOP_K_PER_QUERY:-3}
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-all-MiniLM-L6-v2}
      SIMPLE_TOP_K: ${SIMPLE_TOP_K:-6}
      AGENTIC_SCORE_THRESHOLD: ${AGENTIC_SCORE_THRESHOLD:-0.20}
      MAX_CHUNK_CHARS: ${MAX_CHUNK_CHARS:-4000}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-50000}
    ports:
      - "${BIND_HOST:-127.0.0.1}:9200:9200"
    volumes:
      - agentic_rag_logs:/logs/agentic-rag
    restart: unless-stopped
    networks:
      - ai-stack

volumes:
  agentic_rag_logs:

networks:
  ai-stack:
    name: ${AI_STACK_NETWORK:-ai-stack-vm_default}
    external: true
