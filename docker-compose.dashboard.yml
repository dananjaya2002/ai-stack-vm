services:
  dashboard:
    image: ai-stack/dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ai-stack-dashboard
    env_file:
      - scripts/dashboard/dashboard.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      INDEX_MEMORY_SCRIPT: /app/memory-proxy/index_memory.py
      INDEX_CODE_SCRIPT: /app/watcher/index_code.py
      WATCH_MEMORY_SCRIPT: /app/memory-proxy/watch_memory.py
      WATCH_CODE_SCRIPT: /app/watcher/watch_code.py
      DASHBOARD_LOG_DIR: /tmp/ai-stack-dashboard
    ports:
      - "${BIND_HOST:-127.0.0.1}:9100:9100"
    volumes:
      - ${AI_STACK_HOME}/memory/engineering-memory:/memory/engineering-memory
      - ${AI_STACK_HOME}/memory/code-memory:/memory/code-memory
      - memory_logs:/logs/memory
      - code_logs:/logs/code
    restart: unless-stopped

volumes:
  memory_logs:
  code_logs:
