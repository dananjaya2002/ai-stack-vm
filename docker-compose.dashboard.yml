services:
  dashboard:
    image: ai-stack/dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ai-stack-dashboard
    environment:
      LLAMA_BASE_URL: ${LLM_BASE_URL:-http://vm-llama:8082/v1}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ENGINEERING_MEMORY_DIR: /memory/engineering-memory
      CODE_MEMORY_DIR: /memory/code-memory
      MEMORY_LOG: /logs/memory/memory_api.log
      CODE_LOG: /logs/code/code_proxy.log
      MEMORY_DIR: /memory/engineering-memory
      MEMORY_ROOT: /memory/engineering-memory
      REPOS_ROOT: /memory/code-memory
      INDEX_MEMORY_SCRIPT: /app/memory-proxy/index_memory.py
      INDEX_CODE_SCRIPT: /app/watcher/index_code.py
      WATCH_MEMORY_SCRIPT: /app/memory-proxy/watch_memory.py
      WATCH_CODE_SCRIPT: /app/watcher/watch_code.py
      DASHBOARD_LOG_DIR: /tmp/ai-stack-dashboard
      SECURITY_MODE: ${SECURITY_MODE:-development}
      DASHBOARD_AUTH_MODE: ${DASHBOARD_AUTH_MODE:-auto}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
    ports:
      - "${DASHBOARD_BIND_HOST:-0.0.0.0}:9100:9100"
    volumes:
      - ${AI_STACK_HOME}/memory/engineering-memory:/memory/engineering-memory
      - ${AI_STACK_HOME}/memory/code-memory:/memory/code-memory
      - memory_logs:/logs/memory
      - code_logs:/logs/code
    restart: unless-stopped

  indexer:
    image: ai-stack/dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      LLAMA_BASE_URL: ${LLM_BASE_URL:-http://vm-llama:8082/v1}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ENGINEERING_MEMORY_DIR: /memory/engineering-memory
      CODE_MEMORY_DIR: /memory/code-memory
      MEMORY_DIR: /memory/engineering-memory
      MEMORY_ROOT: /memory/engineering-memory
      REPOS_ROOT: /memory/code-memory
      INDEX_MEMORY_SCRIPT: /app/memory-proxy/index_memory.py
      INDEX_CODE_SCRIPT: /app/watcher/index_code.py
    volumes:
      - ${AI_STACK_HOME}/memory/engineering-memory:/memory/engineering-memory
      - ${AI_STACK_HOME}/memory/code-memory:/memory/code-memory
    command: ["python", "-c", "print('indexer is a one-shot helper; use ./ai-stack index memory or ./ai-stack index code <repo-path>')"]
    restart: "no"

volumes:
  memory_logs:
  code_logs:
