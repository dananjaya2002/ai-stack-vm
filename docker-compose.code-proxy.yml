# docker-compose.code-proxy.yml  –  Runs code-proxy + Qdrant only
#
# Usage:
#   docker compose -f docker-compose.code-proxy.yml up -d
#   docker compose -f docker-compose.code-proxy.yml down
#   docker compose -f docker-compose.code-proxy.yml logs -f
# On Linux/macOS, set USERPROFILE=$HOME before running if USERPROFILE is unset.

services:

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "${BIND_HOST:-127.0.0.1}:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  code-proxy:
    image: ai-stack/code-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.code-proxy
    container_name: code-proxy
    env_file:
      - scripts/code-proxy/.example.code-proxy.env
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-development}
      AI_STACK_API_KEY: ${AI_STACK_API_KEY:-}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "${BIND_HOST:-127.0.0.1}:9001:9001"
    depends_on:
      - qdrant
    volumes:
      - code_logs:/logs/code
      - ${USERPROFILE}/ai-stack/memory/code-memory:/code-memory:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  qdrant_data:
  code_logs:
